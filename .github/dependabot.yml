version: 2
updates:
  - package-ecosystem: pip
    directory: /cve-backend
    schedule:
      interval: weekly
    groups:
      # One PR for routine bumps; majors still get their own PRs
      pip-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /cve-frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
