name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on a PR. Runs on main always finish: Vercel deploys every commit
# there, so each one should get a CI result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cve-backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Vercel's Python runtime default
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cve-backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

      - name: Type-check
        run: mypy

      - name: Test
        run: pytest --cov

      # The frontend's types are generated from this file, so it must match the code
      - name: Check the OpenAPI schema is up to date
        run: |
          python -m scripts.export_openapi
          git diff --exit-code ../cve-frontend/openapi.json || {
            echo "::error::cve-frontend/openapi.json is out of date. Run 'python -m scripts.export_openapi' in cve-backend and commit it."
            exit 1
          }

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cve-frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cve-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Check the generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is out of date. Run 'npm run gen:api' in cve-frontend and commit it."
            exit 1
          }

      - name: Build
        run: npm run build
